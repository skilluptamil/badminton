<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Login | Smash & Spin Arenas</title>
  <meta name="description" content="Log in to your Smash & Spin player account to manage court reservations, tournament entries, and membership perks.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="apple-touch-icon" href="assets/images/favicon.svg">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body>

  <!-- Top Floating Controls -->
  <div class="position-fixed top-0 start-0 end-0 p-3 z-3 d-flex justify-content-between align-items-center pe-none">
    <a href="index.html" class="control-btn shadow-sm pe-auto" title="Back to Home" aria-label="Back to Home">
      <i class="bi bi-arrow-left"></i>
    </a>
    <div class="d-flex gap-2 pe-auto">
      <button type="button" class="control-btn dir-toggle-btn shadow-sm" title="Toggle LTR / RTL" aria-label="Toggle LTR / RTL">
        <i class="bi bi-arrow-left-right"></i>
      </button>
      <button type="button" class="control-btn theme-toggle-btn shadow-sm" title="Toggle Dark / Light Mode" aria-label="Toggle Dark / Light Mode">
        <i class="bi bi-moon-stars-fill"></i>
      </button>
    </div>
  </div>

  <!-- =========================================================================
       LOGIN CONTENT
       ========================================================================= -->
  <main class="auth-wrapper min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-10">

          <!-- Brand Logo -->
          <div class="text-center mb-4">
            <a class="brand-logo justify-content-center d-inline-flex" href="index.html">
              <div class="brand-icon"><i class="bi bi-trophy-fill"></i></div>
              <div class="brand-text">Smash<span>&</span>Spin</div>
            </a>
          </div>

          <div class="auth-card">
            <div class="auth-header">
              <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                <i class="bi bi-person-badge-fill"></i>
              </div>
              <h2>Player Login</h2>
              <p>Welcome back! Sign in to manage your court bookings.</p>
            </div>

            <!-- Login Alert -->
            <div id="loginAlert" class="alert d-none"></div>

            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="loginEmail" class="form-label small fw-bold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                  <input type="email" class="form-control border-start-0" id="loginEmail" placeholder="player@example.com" required>
                </div>
                <div class="invalid-feedback">Please enter a valid email address.</div>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="loginPassword" class="form-label small fw-bold mb-0">Password</label>
                  <a href="#" class="small text-decoration-none" onclick="showToast('Password reset link sent to your email!'); return false;"><bdi>Forgot Password?</bdi></a>
                </div>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                  <input type="password" class="form-control border-start-0 border-end-0" id="loginPassword" placeholder="Enter your password" required>
                  <button class="btn btn-outline-light border border-start-0 text-muted password-toggle-btn" type="button" aria-label="Toggle password visibility">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
                <div class="invalid-feedback">Password is required.</div>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                <label class="form-check-label small text-muted" for="rememberMe">
                  Remember my session on this device
                </label>
              </div>

              <button type="submit" class="btn btn-primary btn-lg w-100 mb-3" id="loginSubmitBtn">
                <span>Sign In to Dashboard</span> <i class="bi bi-box-arrow-in-right"></i>
              </button>

              <!-- Social Login Divider -->
              <div class="auth-divider">
                <span>Or continue with</span>
              </div>

              <!-- Social Login Buttons -->
              <div class="social-auth-grid">
                <button type="button" class="btn-social-auth btn-social-google" aria-label="Sign in with Google" onclick="if(window.showToast)showToast('Social authentication is currently in preview mode. Please sign in with your email.');">
                  <svg width="18" height="18" viewBox="0 0 24 24" class="social-icon" aria-hidden="true">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                  </svg>
                  <span class="social-text">Google</span>
                </button>
                <button type="button" class="btn-social-auth btn-social-facebook" aria-label="Sign in with Facebook" onclick="if(window.showToast)showToast('Social authentication is currently in preview mode. Please sign in with your email.');">
                  <svg width="18" height="18" viewBox="0 0 24 24" class="social-icon" aria-hidden="true">
                    <path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                  </svg>
                  <span class="social-text">Facebook</span>
                </button>
                <button type="button" class="btn-social-auth btn-social-apple" aria-label="Sign in with Apple" onclick="if(window.showToast)showToast('Social authentication is currently in preview mode. Please sign in with your email.');">
                  <svg width="18" height="18" viewBox="0 0 24 24" class="social-icon icon-apple" fill="currentColor" aria-hidden="true">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.44c.66-.82 1.11-1.96.99-3.1-.96.04-2.18.66-2.88 1.47-.61.71-1.15 1.87-1.01 2.98 1.07.08 2.22-.57 2.9-1.35z"/>
                  </svg>
                  <span class="social-text">Apple</span>
                </button>
              </div>

              <div class="text-center small text-muted">
                Don't have an account yet? <a href="register.html" id="linkToRegister" class="fw-bold text-primary">Sign Up</a>
              </div>

              <!-- Demo Credentials Quick Helper -->
              <div class="mt-4 p-3 bg-light rounded-3 border text-start">
                <div class="d-flex align-items-center justify-content-between mb-1">
                  <span class="small fw-bold text-dark"><i class="bi bi-shield-check text-success me-1"></i> Pre-configured Demo Player</span>
                  <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none fw-semibold" onclick="document.getElementById('loginEmail').value='alex.morgan@example.com';document.getElementById('loginPassword').value='password123';if(window.showToast)showToast('Demo credentials filled!');">Fill Demo</button>
                </div>
                <div class="small text-muted font-monospace" style="font-size: 0.8rem;">Email: alex.morgan@example.com</div>
                <div class="small text-muted font-monospace" style="font-size: 0.8rem;">Password: password123</div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Preserve redirect param on the sign-up link
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const redirectParam = urlParams.get('redirect');
      if (redirectParam) {
        const regLink = document.getElementById('linkToRegister');
        if (regLink) {
          regLink.href = 'register.html?redirect=' + encodeURIComponent(redirectParam);
        }
      }
    });
  </script>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS Modules -->
  <script src="assets/js/theme-direction.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/blog-data.js"></script>
  <script src="assets/js/booking.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
