          <ul class="navbar-nav mx-auto mb-2 mb-lg-0">

  </header>

  <!-- =========================================================================
       LOGIN CONTENT
       ========================================================================= -->
  <main class="auth-wrapper">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
          <div class="auth-card">
            <div class="auth-header">
              <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                <i class="bi bi-person-badge-fill"></i>
              </div>
              <h2>Player Login</h2>
              <p>Welcome back! Sign in to manage your court bookings.</p>
            </div>

            <!-- Login Alert -->
            <div id="loginAlert" class="alert d-none"></div>

            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="loginEmail" class="form-label small fw-bold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                  <input type="email" class="form-control border-start-0" id="loginEmail" placeholder="player@example.com" required>
                </div>
                <div class="invalid-feedback">Please enter a valid email address.</div>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="loginPassword" class="form-label small fw-bold mb-0">Password</label>
                  <a href="#" class="small text-decoration-none" onclick="showToast('Password reset link sent to your email!'); return false;"><bdi>Forgot Password?</bdi></a>
                </div>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                  <input type="password" class="form-control border-start-0 border-end-0" id="loginPassword" placeholder="Enter your password" required>
                  <button class="btn btn-outline-light border border-start-0 text-muted password-toggle-btn" type="button" aria-label="Toggle password visibility">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
                <div class="invalid-feedback">Password is required.</div>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                <label class="form-check-label small text-muted" for="rememberMe">
                  Remember my session on this device
                </label>
              </div>

              <button type="submit" class="btn btn-primary btn-lg w-100 mb-3" id="loginSubmitBtn">
                <span>Sign In to Dashboard</span> <i class="bi bi-box-arrow-in-right"></i>
              </button>

              <div class="text-center small text-muted">
                Don't have an account yet? <a href="register.html" class="fw-bold text-primary">Sign Up</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
