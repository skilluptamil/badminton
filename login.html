<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Login | Smash & Spin Arenas</title>
  <meta name="description" content="Log in to your Smash & Spin player account to manage court reservations, tournament entries, and membership perks.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="apple-touch-icon" href="assets/images/favicon.svg">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body>

  <!-- Top Floating Controls -->
  <div class="position-fixed top-0 start-0 end-0 p-3 z-3 d-flex justify-content-between align-items-center pe-none">
    <a href="index.html" class="control-btn shadow-sm pe-auto" title="Back to Home" aria-label="Back to Home">
      <i class="bi bi-arrow-left"></i>
    </a>
    <div class="d-flex gap-2 pe-auto">
      <button type="button" class="control-btn dir-toggle-btn shadow-sm" title="Toggle LTR / RTL" aria-label="Toggle LTR / RTL">
        <i class="bi bi-arrow-left-right"></i>
      </button>
      <button type="button" class="control-btn theme-toggle-btn shadow-sm" title="Toggle Dark / Light Mode" aria-label="Toggle Dark / Light Mode">
        <i class="bi bi-moon-stars-fill"></i>
      </button>
    </div>
  </div>

  <!-- =========================================================================
       LOGIN CONTENT
       ========================================================================= -->
  <main class="auth-wrapper min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-10">

          <!-- Brand Logo -->
          <div class="text-center mb-4">
            <a class="brand-logo justify-content-center d-inline-flex" href="index.html">
              <div class="brand-icon"><i class="bi bi-trophy-fill"></i></div>
              <div class="brand-text">Smash<span>&</span>Spin</div>
            </a>
          </div>

          <div class="auth-card">
            <div class="auth-header">
              <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                <i class="bi bi-person-badge-fill"></i>
              </div>
              <h2>Player Login</h2>
              <p>Welcome back! Sign in to manage your court bookings.</p>
            </div>

            <!-- Login Alert -->
            <div id="loginAlert" class="alert d-none"></div>

            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="loginEmail" class="form-label small fw-bold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                  <input type="email" class="form-control border-start-0" id="loginEmail" placeholder="player@example.com" required>
                </div>
                <div class="invalid-feedback">Please enter a valid email address.</div>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="loginPassword" class="form-label small fw-bold mb-0">Password</label>
                  <a href="#" class="small text-decoration-none" onclick="showToast('Password reset link sent to your email!'); return false;"><bdi>Forgot Password?</bdi></a>
                </div>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                  <input type="password" class="form-control border-start-0 border-end-0" id="loginPassword" placeholder="Enter your password" required>
                  <button class="btn btn-outline-light border border-start-0 text-muted password-toggle-btn" type="button" aria-label="Toggle password visibility">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
                <div class="invalid-feedback">Password is required.</div>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                <label class="form-check-label small text-muted" for="rememberMe">
                  Remember my session on this device
                </label>
              </div>

              <button type="submit" class="btn btn-primary btn-lg w-100 mb-3" id="loginSubmitBtn">
                <span>Sign In to Dashboard</span> <i class="bi bi-box-arrow-in-right"></i>
              </button>

              <!-- Social Login Divider -->
              <div class="auth-divider">
                <span>Or continue with</span>
              </div>

              <!-- Social Login Buttons (UI elements without fake login) -->
              <div class="social-auth-grid">
                <button type="button" class="btn-social-auth" aria-label="Sign in with Google" onclick="showToast('Social authentication is currently in preview mode. Please sign in with your email.');">
                  <i class="bi bi-google"></i>
                  <span>Google</span>
                </button>
                <button type="button" class="btn-social-auth" aria-label="Sign in with Facebook" onclick="showToast('Social authentication is currently in preview mode. Please sign in with your email.');">
                  <i class="bi bi-facebook"></i>
                  <span>Facebook</span>
                </button>
                <button type="button" class="btn-social-auth" aria-label="Sign in with Apple" onclick="showToast('Social authentication is currently in preview mode. Please sign in with your email.');">
                  <i class="bi bi-apple"></i>
                  <span>Apple</span>
                </button>
              </div>

              <div class="text-center small text-muted">
                Don't have an account yet? <a href="register.html" class="fw-bold text-primary">Sign Up</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS Modules -->
  <script src="assets/js/theme-direction.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/blog-data.js"></script>
  <script src="assets/js/booking.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
